name: Build Android .so

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v3
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Create CMake Project Structure
        run: |
          mkdir -p jni
          if [ ! -f "jni/CMakeLists.txt" ]; then
            echo 'cmake_minimum_required(VERSION 3.22.1)' > jni/CMakeLists.txt
            echo 'project(rde_ai)' >> jni/CMakeLists.txt
            echo 'add_library(rde_ai SHARED main.cpp)' >> jni/CMakeLists.txt
          fi

      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                ../jni
          cmake --build .

      - name: Upload Artifact (.so)
        uses: actions/upload-artifact@v4
        with:
          name: rde_ai_so
          path: build/librde_ai.so
          
